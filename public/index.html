<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suno AI Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { max-width: 500px; width: 100%; padding: 20px; }
    .card { background: #fff; border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); text-align: center; }
    h1 { font-size: 24px; margin-bottom: 8px; color: #1e293b; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }
    input[type="text"] { width: 100%; padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #6366f1; }
    .hint { color: #94a3b8; font-size: 12px; margin-top: 8px; margin-bottom: 20px; }
    .btn { background: #6366f1; color: #fff; border: none; padding: 12px 32px; border-radius: 10px; font-size: 16px; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn:hover { background: #4f46e5; }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    .result-card { margin-top: 24px; padding: 20px; background: #f1f5f9; border-radius: 12px; text-align: center; }
    .result-card h3 { margin-bottom: 12px; color: #1e293b; }
    .result-card audio { width: 100%; margin: 12px 0; border-radius: 8px; }
    .result-card img { max-width: 200px; border-radius: 8px; margin: 10px 0; }
    .btn-audio { display: inline-block; margin: 6px; padding: 10px 20px; background: #22c55e; color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; transition: background 0.2s; }
    .btn-audio:hover { background: #16a34a; }
    .btn-video { display: inline-block; margin: 6px; padding: 10px 20px; background: #f97316; color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; transition: background 0.2s; }
    .btn-video:hover { background: #ea580c; }
    .error { background: #fef2f2; }
    .error p { color: #dc2626; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Suno AI Download</h1>
      <p class="subtitle">Download audio & video from Suno</p>
      <input type="text" id="urlInput" placeholder="https://suno.com/song/xxx-xxx">
      <p class="hint">Supports short links (suno.com/s/xxx) and full links</p>
      <button class="btn" id="dlBtn" onclick="handleDownload()">Download</button>
    </div>
    <div id="result"></div>
  </div>
  <script>
    function handleDownload() {
      var btn = document.getElementById('dlBtn');
      var result = document.getElementById('result');
      var url = document.getElementById('urlInput').value.trim();
      if (!url) { alert('Please enter a Suno song URL'); return; }
      if (!/^https?:\/\/(www\.)?suno\.com\/.+/i.test(url)) { alert('Invalid Suno URL'); return; }
      btn.disabled = true;
      btn.textContent = 'Processing...';
      result.style.display = 'none';
      fetch('/api/sniff', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: url })
      }).then(function(r) {
        if (!r.ok) throw new Error('Failed: ' + r.status);
        return r.json();
      }).then(function(data) {
        if (data.error) throw new Error(data.error);
        var title = data.title || 'Suno Song';
        var audioUrl = data.audio || '';
        var videoUrl = data.video || '';
        var imgUrl = data.thumbnail || '';
        if (!audioUrl && !videoUrl) { throw new Error('No downloadable media found'); }
        var html = '<div class="result-card">';
        html += '<h3>' + title + '</h3>';
        if (imgUrl) html += '<img src="' + imgUrl + '" alt="cover">';
        if (audioUrl) html += '<audio controls src="' + audioUrl + '"></audio><br>';
        if (audioUrl) html += '<a href="' + audioUrl + '" download class="btn-audio" target="_blank">Download Audio</a> ';
        if (videoUrl) html += '<a href="' + videoUrl + '" download class="btn-video" target="_blank">Download Video</a>';
        html += '</div>';
        result.innerHTML = html;
        result.style.display = 'block';
      }).catch(function(err) {
        result.innerHTML = '<div class="result-card error"><p>Error</p><p>' + err.message + '</p></div>';
        result.style.display = 'block';
      }).finally(function() {
        btn.disabled = false;
        btn.textContent = 'Download';
      });
    }
  </script>
</body>
</html>
